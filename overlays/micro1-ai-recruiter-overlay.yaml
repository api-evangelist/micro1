- target: $.info
  update:
    x-apievangelist-contract-gaps:
    - id: no-versioning
      detail: No version segment, header or date pinning. info.version 1.0.0 is the only marker.
      evidence: lifecycle/micro1-lifecycle.yml
    - id: no-idempotency
      detail: >-
        No Idempotency-Key on any write. POST /interview/invite and POST /job/{jobId}/applicant
        duplicate on retry.
      evidence: conventions/micro1-conventions.yml
    - id: auth-errors-undeclared
      detail: >-
        401 and 403 are documented in prose on the authentication page but declared on zero
        operations, so generated clients do not model the auth failure path.
      evidence: errors/micro1-problem-types.yml
    - id: opaque-operation-ids
      detail: >-
        15 of 18 operationIds are UUID-suffixed (aiInterviewer-ce2743c0-2309-41eb-8ff2-...), which
        generates unusable client method names and unstable agent tool names.
      evidence: openapi/micro1-ai-recruiter-openapi.yml
    - id: no-declared-tags-object
      detail: Operations carry tags but the root tags[] object is absent, so tags have no descriptions.
      evidence: openapi/micro1-ai-recruiter-openapi.yml
    - id: uuid-schema-names
      detail: >-
        All 75 component schemas are keyed by UUID rather than by name; the human-readable name only
        appears in the schema `title`. Titles are duplicated wholesale — BadRequestResponse and
        InternalServerErrorResponse each appear 18 times as 18 separate schemas — so nothing is reused.
      evidence: openapi/micro1-ai-recruiter-openapi.yml
    - id: no-webhook-signing
      detail: No signature or timestamp header documented for webhook deliveries.
      evidence: asyncapi/micro1-webhooks.yml
    - id: no-hsts-on-api-host
      detail: HSTS is present on www and docs hosts but absent on public.api.micro1.ai.
      evidence: security/micro1-domain-security.yml
