description: >-
  The headline finding for micro1 is a SURFACE SPLIT, not a mapping. micro1 publishes two agent
  surfaces and one machine-readable contract, and they do not overlap: the MCP server is scoped to
  the documentation site (search / read the docs and spec / file a docs bug), while every real
  capability — create an interview, invite a candidate, pull a report, register a webhook — lives
  only in the REST API behind an x-api-key. No MCP tool binds to any OpenAPI operation, so
  crosswalk[] is empty by fact rather than by omission: all three tools are mcp_only and all
  eighteen operations are rest_only. An agent that wants to *act* on micro1 must call REST directly
  (or follow the provider-published Agent Skill in ../skills/micro1-recruiter-skill.md, which is the
  bridge micro1 actually ships between the two surfaces).
