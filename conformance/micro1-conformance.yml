description: >-
  Which cross-cutting and industry standards the micro1 Public API conforms to. micro1's agent-side
  posture (A2A, MCP, llms.txt, agent skills) is well ahead of its API-side posture (no OAuth, no
  RFC 9457, no RFC 9116, no published compliance program). No `Compliance` pointer is wired in
  apis.yml because micro1 publishes no certifications — see the compliance block below.
standards:
