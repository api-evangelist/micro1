aid: micro1
name: micro1
description: >-
  micro1 is an AI-native talent and human-data company. Its AI recruiter, Zara, runs conversational
  technical interviews at scale — generating role-specific questions from the skills you want tested,
  branching in real time, adding an optional coding exercise, and returning a structured report with
  per-skill AI ratings, CEFR-style soft-skill scores, a proctoring integrity score, transcripts and
  session recordings. The company also operates an expert-human-data business (Realm reinforcement-
  learning environments, Cortex agent evaluations, and robotics data collection) that supplies training
  and evaluation data to frontier AI labs. The micro1 Public API exposes the AI-interview platform:
  create standard or custom-question interviews, invite candidates, list jobs and job applicants,
  retrieve completed reports and recordings, and register webhooks so an ATS is notified in real time
  when interviews start, reports are generated, recordings finish processing, or resume scores land.
