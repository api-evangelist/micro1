apis:
- name: micro1 Public API
  description: >-
    The micro1 AI Recruiter public REST API. Create conversational AI interviews from a skill list (or
    from your own custom questions), preview the questions the AI will ask, invite candidates by email,
    list jobs and job applicants, pull completed interview reports (per-skill technical ratings, soft
    skills, coding evaluation, proctoring score and violations, full transcript) and interview
    recordings, and manage webhook subscriptions for the platform's nine event types. Authenticated
    with an `x-api-key` header issued from the micro1 dashboard.
  humanURL: https://ai-recruiter.micro1.ai/api-reference/getting-started/introduction
